<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mainframe Latão</title>
<style>
*{box-sizing:border-box}html{background:#0d0c09;color:#cfc4aa;font:14px "IBM Plex Mono",monospace}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(560px,85vw);padding:40px 0}header{text-align:center;margin-bottom:52px}#date{color:#6e5836;font-size:11px;letter-spacing:.35em}time{display:block;color:#9eea8e;font-size:80px;font-weight:400;letter-spacing:4px;margin-top:12px;text-shadow:0 0 14px #9eea8e25}label{display:block;color:#b8925a;font-size:11px;letter-spacing:.3em;margin-bottom:10px}.entry{display:flex;gap:14px;align-items:center;border:1px solid #6e5836;border-bottom:2px solid #9eea8e;background:#15130e;padding:13px 16px}.entry span{color:#9eea8e}input{border:0;outline:0;background:none;color:#e9dfc8;font:inherit;width:100%;caret-color:#9eea8e}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}a{display:block;color:#cfc4aa;text-decoration:none;border:1px solid #3a3224;padding:16px 12px}a small{display:block;color:#6e5836;font-size:10px;letter-spacing:2px;margin-bottom:8px}a:hover,a:focus-visible{border-color:#c8743f;color:#9eea8e;outline:0}footer{color:#4a4233;text-align:center;margin-top:46px;font-size:9px;letter-spacing:.2em}@media(max-width:520px){time{font-size:60px}nav{grid-template-columns:repeat(2,1fr)}}
</style><main><header><div id="date"></div><time id="clock"></time></header><form action="https://www.google.com/search" method="get"><label for="query">CONSULTA</label><div class="entry"><span>▶</span><input id="query" name="q" autocomplete="off" aria-label="Pesquisar na web"></div></form><nav><a href="https://github.com"><small>Nº 1</small>github</a><a href="https://wiki.hypr.land"><small>Nº 2</small>hypr wiki</a><a href="https://herdr.dev"><small>Nº 3</small>herdr</a><a href="https://claude.ai"><small>Nº 4</small>claude</a></nav><footer>MAINFRAME LATÃO · TERMINAL DE FÓSFORO</footer></main><script>
function tick(){const d=new Date();document.getElementById('date').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short'}).toUpperCase();const t=document.getElementById('clock');t.textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});t.dateTime=d.toISOString()}tick();setInterval(tick,1000);
