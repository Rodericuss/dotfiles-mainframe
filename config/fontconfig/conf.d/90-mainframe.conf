<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<alias><family>monospace</family><prefer><family>IBM Plex Mono</family><family>GeistMono Nerd Font</family></prefer></alias>
<alias><family>sans-serif</family><prefer><family>IBM Plex Sans Condensed</family></prefer></alias>
<match target="font"><edit name="antialias" mode="assign"><bool>true</bool></edit><edit name="hinting" mode="assign"><bool>true</bool></edit><edit name="hintstyle" mode="assign"><const>hintslight</const></edit></match>
</fontconfig>
