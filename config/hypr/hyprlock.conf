# Mainframe Latão · Hyprlock
# Fundo estático (mostrador, placa, rótulos) gerado por ~/.config/hypr/hyprlock/render.py
# Posições = artboard 1920x1080, relativas ao centro (y para cima). Cores com ## (escape do hyprlang).

source = ~/.cache/mainframe-lock/backgrounds.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1500
    immediate_render = true
}

animations {
    enabled = true
    bezier = latao, 0.2, 0.8, 0.2, 1
    animation = fadeIn, 1, 3, latao
    animation = fadeOut, 1, 2, latao
    animation = inputFieldColors, 1, 2, latao
    animation = inputFieldFade, 1, 2, latao
    animation = inputFieldDots, 1, 1, latao
}

# ── relógio de fósforo ──────────────────────────────────────────────
label {
    text = $TIME
    font_family = IBM Plex Mono Medium
    font_size = 132
    color = rgb(9EEA8E)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(9EEA8E50)
    shadow_boost = 1.0
    position = 0, 189
    halign = center
    valign = center
}

label {
    text = cmd[update:30000] ~/.config/hypr/hyprlock/info date
    font_family = IBM Plex Mono
    font_size = 10
    color = rgb(B8925A)
    text_align = center
    position = 0, 301
    halign = center
    valign = center
}

# ── campo de senha (3 camadas: moldura, linha inferior, blocos) ─────
# moldura: borda inteira 1px; pátina ao verificar, vermelho no erro, não muda no caps
input-field {
    size = 532, 56
    position = 0, -137
    halign = center
    valign = center
    rounding = 0
    outline_thickness = 1
    outer_color = rgb(6E5836)
    inner_color = rgb(0D0C09)
    check_color = rgb(5BA89B)
    fail_color = rgb(D0553F)
    capslock_color = rgb(6E5836)
    font_color = rgba(00000000)
    placeholder_text =
    fail_text =
    check_text =
    fade_on_empty = false
    zindex = 1
}

# linha inferior 2px: acende em fósforo ao digitar, ocre no caps; some quando vazio
input-field {
    size = 532, 2
    position = 0, -164
    halign = center
    valign = center
    rounding = 0
    outline_thickness = 1
    outer_color = rgb(9EEA8E)
    inner_color = rgb(9EEA8E)
    check_color = rgb(5BA89B)
    fail_color = rgb(D0553F)
    capslock_color = rgb(E0B04E)
    font_color = rgba(00000000)
    placeholder_text =
    fail_text =
    check_text =
    fade_on_empty = true
    fade_timeout = 0
    zindex = 2
}

# blocos de fósforo à esquerda, depois da seta (textos com nbsp para alinhar à esquerda)
input-field {
    size = 504, 54
    position = 13, -136
    halign = center
    valign = center
    rounding = 0
    outline_thickness = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)
    font_color = rgb(9EEA8E)
    font_family = IBM Plex Mono
    dots_size = 0.26
    dots_spacing = 0.7
    dots_center = false
    dots_rounding = 0
    placeholder_text = <span foreground="##4A4233" letter_spacing="768">digite a senha                              </span>
    check_text = <span foreground="##5BA89B" letter_spacing="768">verificando…                                </span>
    fail_text = <span foreground="##D0553F" letter_spacing="768">acesso negado · tentativa $ATTEMPTS                 </span>
    fade_on_empty = false
    zindex = 3
}

# seta ▶
label {
    text = ▶
    font_family = IBM Plex Mono
    font_size = 13
    color = rgb(C8743F)
    position = -239, -137
    halign = center
    valign = center
    zindex = 4
}

# ── cantos ──────────────────────────────────────────────────────────
label {
    text = cmd[update:0] ~/.config/hypr/hyprlock/info since
    font_family = IBM Plex Mono
    font_size = 9
    color = rgb(8C8068)
    position = 145, -36
    halign = left
    valign = top
}

label {
    text = cmd[update:30000] ~/.config/hypr/hyprlock/info bat
    font_family = IBM Plex Mono
    font_size = 9
    color = rgb(CFC4AA)
    position = 47, 36
    halign = left
    valign = bottom
}
