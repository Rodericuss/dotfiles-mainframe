# Mainframe Latão — IBM Plex Mono, opaque phosphor terminal.
font_family IBM Plex Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11
background #0D0C09
foreground #E9DFC8
selection_background #9EEA8E
selection_foreground #0D0C09
cursor #9EEA8E
cursor_text_color #0D0C09
cursor_shape block
cursor_blink_interval 0
cursor_trail 0
background_opacity 1
window_padding_width 14
active_border_color #C8743F
inactive_border_color #3A3224
tab_bar_edge top
tab_bar_style separator
tab_separator " │ "
tab_title_template " {index} {title} "
active_tab_title_template " {index} {title} "
active_tab_foreground #9EEA8E
active_tab_background #0D0C09
inactive_tab_foreground #9A8E73
inactive_tab_background #15130E
tab_bar_background #15130E
active_tab_font_style normal
bell_on_tab no
initial_window_width 1000
initial_window_height 650
remember_window_size no
color0 #0D0C09
color1 #D0553F
color2 #9EEA8E
color3 #E0B04E
color4 #6F93A8
color5 #B07A8C
color6 #5BA89B
color7 #CFC4AA
color8 #4A4233
color9 #E8775F
color10 #C3F5B6
color11 #F2CD7A
color12 #94B5C7
color13 #CC9AAB
color14 #86C7BB
color15 #F2EAD6

# Keep the block cursor at the Fish prompt too.
shell_integration no-cursor
